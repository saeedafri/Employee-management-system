name: Deploy to Hostinger

# Every green CI run on main deploys that exact commit to the VPS (187.126.125.239, shared
# with rentocloud). No manual steps. The deploy key is a forced-command key: it can only run
# /usr/local/sbin/ems-deploy-shim, which runs deploy/hostinger/deploy.sh from the release:
# pg_dump -> build image -> cut over -> health-gated, automatic rollback on failure.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-hostinger
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy tested commit
    # Only after CI passed on a push to main (never for PRs or red runs).
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Ship release to the VPS
        env:
          DEPLOY_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.HOSTINGER_KNOWN_HOSTS }}
          HOST: ${{ secrets.HOSTINGER_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          git archive --format=tar.gz HEAD src prisma package.json package-lock.json deploy \
            | ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o StrictHostKeyChecking=yes \
                -o ConnectTimeout=20 -o ServerAliveInterval=30 "root@$HOST" "deploy $(git rev-parse HEAD)"

      - name: Live health through nginx
        run: |
          for i in $(seq 1 20); do
            code=$(curl -s -m 6 -o /dev/null -w "%{http_code}" https://ems-api.saqibsaeed.cloud/health || echo 000)
            [ "$code" = 200 ] && { echo "live $code"; exit 0; }
            echo "waiting ($code)"; sleep 3
          done
          exit 1

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Every `- [ ] Accept` box in docs/BACKEND_IMPLEMENTATION_SPEC_2026-08-13.md, checked
      # against the environment just deployed, so an RBAC regression cannot sit green on prod.
      - name: Live accept checks (tracker BE-1..BE-11)
        run: node scripts/verifyTrackerAccepts.mjs
        env:
          API_BASE: https://ems-api.saqibsaeed.cloud/api/v1
          TENANT_KEY: acme-corp-001
          SEED_PASSWORD: ${{ secrets.SEED_PASSWORD || 'Password123!' }}
