name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

  build:
    name: Build Check
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Verify app loads
        run: node --input-type=module --eval "import('./src/app.js').then(() => { console.log('App loaded OK'); process.exit(0); }).catch(e => { console.error(e); process.exit(1); });"

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high
        continue-on-error: true

  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: [lint]
    # CLAUDE.md records a test job with a postgres service added 2026-05-27. It
    # is not in this file any more, so nothing has actually been running the 350+
    # tests on push. Restored, with its own throwaway database -- no external DB,
    # and the name contains `ems_test` so the test-database guard accepts it.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ems
          POSTGRES_PASSWORD: ems
          POSTGRES_DB: ems_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://ems:ems@127.0.0.1:5432/ems_test
      JWT_SECRET: ci-test-secret-not-a-real-key
      API_PREFIX: /api/v1

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - run: npm ci

      - name: Apply migrations
        run: npx prisma migrate deploy

      - name: Seed the throwaway test database
        run: npm run db:seed

      - name: Offline suite (no DB, no network)
        run: node scripts/runTests.mjs offline

      - name: DB suite
        run: node scripts/runTests.mjs db
